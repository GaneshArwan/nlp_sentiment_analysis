name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest==9.2.0 bandit==1.9.4 pip-audit==2.10.1
        
    - name: Check syntax
      run: |
        python -m compileall src/ app.py

    - name: Run unit tests
      run: |
        pytest -v
        
    - name: Security scan with Bandit
      run: |
        bandit -r src/ app.py -ll

    - name: Dependency vulnerability audit
      run: |
        # Ignore unpatched upstream accelerate advisory (PYSEC-2026-3804 has no fix version yet)
        pip-audit --ignore-vuln PYSEC-2026-3804 -r requirements.txt
