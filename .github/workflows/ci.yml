name: Python CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install lightweight test and lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt scikit-learn matplotlib seaborn pydantic reportlab pytest==9.2.0 bandit==1.9.4

    - name: Check syntax
      run: |
        python -m compileall src/ app.py

    - name: Run unit tests
      run: |
        pytest -v

    - name: Security scan with Bandit
      run: |
        bandit -r src/ app.py -ll
